<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAS Control Terminal & Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0F172A; color: #F8FAFC; }
    </style>
</head>
<body class="min-h-screen p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Header & Connection Status -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-cyan-400">لوحة تحكم NAS (Terminal Mode)</h1>
                <p class="text-sm text-slate-400">تحكم بالأجهزة المتعددة وتصفح الملفات</p>
            </div>
            
            <div class="flex items-center gap-3">
                <select id="deviceSelector" onchange="changeDevice()" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg px-3 py-2 font-bold focus:outline-none focus:border-cyan-500 shadow cursor-pointer">
                    <option value="">جاري تحميل الأجهزة...</option>
                </select>

                <div id="deviceStatusIndicator" class="text-xs px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-slate-400 font-bold shadow">
                    جاري التحقق...
                </div>
                <button onclick="fetchDirectory(currentPath)" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow">
                    🔄 تحديث المجلد
                </button>
            </div>
        </header>

        <!-- Actions Panel -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                <h2 class="text-lg font-semibold mb-3 text-emerald-400">📥 تحميل ملف للهاتف المحدد</h2>
                <input type="text" id="fileUrl" placeholder="رابط الملف المباشر (URL)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 mb-3 text-sm focus:outline-none focus:border-emerald-500">
                <input type="text" id="fileName" placeholder="اسم الملف مع الامتداد (مثل: video.mp4)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 mb-3 text-sm focus:outline-none focus:border-emerald-500">
                <button onclick="sendDownloadCommand()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg font-medium transition">
                    إرسال أمر التحميل للهاتف
                </button>
            </div>

            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                <h2 class="text-lg font-semibold mb-3 text-amber-400">⬆️ رفع ملف للسحابة من الهاتف المختار</h2>
                <input type="text" id="uploadFileName" placeholder="اسم الملف أو مساره النسبي" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 mb-3 text-sm focus:outline-none focus:border-amber-500">
                <button onclick="sendUploadCommand()" class="w-full bg-amber-600 hover:bg-amber-500 text-white py-2.5 rounded-lg font-medium transition">
                    بدء الرفع الذكي (Smart Upload)
                </button>
            </div>
        </div>

        <!-- File Explorer Terminal Section -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-4 gap-4">
                <div class="flex items-center gap-3">
                    <button onclick="goBack()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded text-xs text-slate-200 transition">⬆️ رجوع للخلف (CD ..)</button>
                    <h2 class="text-lg font-semibold text-slate-200">📁 مستكشف الملفات</h2>
                </div>

                <div class="flex items-center gap-2 bg-slate-900 p-1.5 rounded-lg border border-slate-700 text-xs">
                    <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1 rounded bg-cyan-600 text-white transition font-medium">الكل</button>
                    <button onclick="setFilter('images')" id="filter-images" class="px-3 py-1 rounded text-slate-300 hover:bg-slate-800 transition">الصور 🖼️</button>
                    <button onclick="setFilter('videos')" id="filter-videos" class="px-3 py-1 rounded text-slate-300 hover:bg-slate-800 transition">الفيديوهات 🎬</button>
                </div>

                <div class="flex flex-wrap items-center gap-3">
                    <button id="bulkUploadBtn" onclick="uploadSelected()" class="hidden bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded text-xs text-white transition font-bold shadow-md">
                        ⬆️ رفع المحدد
                    </button>
                    <span id="pathDisplay" class="text-xs bg-slate-900 px-3 py-1 rounded text-cyan-400 border border-slate-700 font-mono">Internal Storage /</span>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-slate-400 text-sm">
                            <th class="py-3 px-4 w-12 text-center">#</th>
                            <th class="py-3 px-4 w-10 text-center"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()" class="cursor-pointer w-4 h-4 accent-emerald-500"></th>
                            <th class="py-3 px-4">اسم الملف / المجلد</th>
                            <th class="py-3 px-4">النوع</th>
                            <th class="py-3 px-4">الحجم</th>
                            <th class="py-3 px-4 text-center">الإجراءات وحالة الرفع</th>
                        </tr>
                    </thead>
                    <tbody id="fileTableBody" class="divide-y divide-slate-700 text-sm">
                        <tr><td colspan="6" class="text-center py-6 text-slate-500">اختر جهازاً لتبدأ...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        const SUPABASE_URL = "https://nrkovpnbjzopvifyomea.supabase.co";
        const SUPABASE_KEY = "sb_publishable_UH8BiQIRab4s4HiA7Gh20g_2B1AEMo9";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeDeviceId = null; 
        let allDevices = [];
        let currentPath = ""; 
        let rawFilesData = []; 
        let currentFilter = 'all'; 
        let previousDeviceStates = {};

        // دالة التنبيه الصوتي
        function playAlertSound(isOnline) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = isOnline ? 'sine' : 'square';
                osc.frequency.setValueAtTime(isOnline ? 880 : 300, ctx.currentTime);
                gain.gain.setValueAtTime(0.4, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch (e) {
                console.error("Audio error:", e);
            }
        }

        async function loadDevicesAndStatus() {
            try {
                const { data, error } = await supabaseClient.from('device_status').select('*').order('last_seen', { ascending: false });
                
                if (data && data.length > 0) {
                    allDevices = data;
                    const selector = document.getElementById('deviceSelector');
                    const statusEl = document.getElementById('deviceStatusIndicator');
                    
                    selector.innerHTML = ''; 
                    let isCurrentActiveStillFound = false;

                    data.forEach(device => {
                        const diffSeconds = Math.abs(Date.now() - device.last_seen) / 1000;
                        const isOnline = diffSeconds <= 30;
                        
                        if (previousDeviceStates[device.device_id] !== undefined) {
                            if (previousDeviceStates[device.device_id] !== isOnline) {
                                playAlertSound(isOnline);
                            }
                        }
                        previousDeviceStates[device.device_id] = isOnline;

                        const statusIcon = isOnline ? '🟢' : '🔴';
                        const shortId = device.device_id.substring(0, 6) + '...';
                        
                        const option = document.createElement('option');
                        option.value = device.device_id;
                        option.text = `${statusIcon} ${shortId}`;
                        selector.appendChild(option);

                        if (device.device_id === activeDeviceId) isCurrentActiveStillFound = true;
                    });

                    if (!activeDeviceId || !isCurrentActiveStillFound) {
                        activeDeviceId = data[0].device_id;
                        fetchDirectory(""); 
                    }
                    selector.value = activeDeviceId;

                    const selectedDeviceData = allDevices.find(d => d.device_id === activeDeviceId);
                    if (selectedDeviceData) {
                        const diffSeconds = Math.abs(Date.now() - selectedDeviceData.last_seen) / 1000;
                        if (diffSeconds <= 30) {
                            statusEl.innerHTML = `🟢 متصل`;
                            statusEl.className = "text-xs px-3 py-2 rounded-lg bg-slate-900 border border-emerald-500 text-emerald-400 font-bold shadow";
                        } else {
                            statusEl.innerHTML = `🔴 غير متصل`;
                            statusEl.className = "text-xs px-3 py-2 rounded-lg bg-slate-900 border border-red-500 text-red-400 font-bold shadow";
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        function changeDevice() {
            activeDeviceId = document.getElementById('deviceSelector').value;
            loadDevicesAndStatus(); 
            fetchDirectory(""); 
        }

        setInterval(loadDevicesAndStatus, 15000);

        async function fetchDirectory(path) {
            if (!activeDeviceId) return;
            currentPath = path;
            document.getElementById('pathDisplay').innerText = path === "" ? "Internal Storage / (الجذر)" : `Internal Storage / ${path}`;
            document.getElementById('selectAll').checked = false;
            updateBulkUploadButton();

            const tbody = document.getElementById('fileTableBody');
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-amber-400 font-bold animate-pulse">جاري الاتصال بالهاتف... ⏳</td></tr>`;

            await supabaseClient.from('device_commands').insert([
                { device_id: activeDeviceId, action: 'list_directory', file_path: path }
            ]);

            setTimeout(loadFilesFromCache, 3000);
        }

        async function loadFilesFromCache() {
            if (!activeDeviceId) return;
            const { data, error } = await supabaseClient.from('device_files_cache')
                .select('*')
                .eq('device_id', activeDeviceId);
            
            if (error || !data || data.length === 0) {
                document.getElementById('fileTableBody').innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">المجلد فارغ، أو أن الهاتف لم يرد.</td></tr>`;
                return;
            }

            const uniqueFiles = [];
            const seenNames = new Set();
            data.forEach(item => {
                if (!seenNames.has(item.file_name)) {
                    seenNames.add(item.file_name);
                    uniqueFiles.push(item);
                }
            });

            rawFilesData = uniqueFiles;
            renderTable();
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            ['all', 'images', 'videos'].forEach(type => {
                const btn = document.getElementById(`filter-${type}`);
                btn.className = type === filterType ? "px-3 py-1 rounded bg-cyan-600 text-white transition font-medium" : "px-3 py-1 rounded text-slate-300 hover:bg-slate-800 transition";
            });
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('fileTableBody');
            tbody.innerHTML = '';
            const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'];
            const videoExts = ['mp4', 'avi', 'mkv', 'mov', 'webm'];

            const filteredFiles = rawFilesData.filter(item => {
                if (item.is_directory) return true;
                const ext = item.file_name.split('.').pop().toLowerCase();
                if (currentFilter === 'images') return imageExts.includes(ext);
                if (currentFilter === 'videos') return videoExts.includes(ext);
                return true;
            });

            if (filteredFiles.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">لا توجد ملفات.</td></tr>`;
                return;
            }

            filteredFiles.sort((a, b) => (b.is_directory === a.is_directory) ? 0 : b.is_directory ? 1 : -1);

            filteredFiles.forEach((item, index) => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-750 transition cursor-pointer";
                if (item.is_directory) row.onclick = () => fetchDirectory(item.file_path);

                let actionButtonHtml = '';
                if (item.is_directory) {
                    actionButtonHtml = `<button onclick="fetchDirectory('${item.file_path}')" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded text-xs transition">فتح 📂</button>`;
                } else {
                    if (item.upload_status === 'uploading') {
                        actionButtonHtml = `<button disabled class="bg-amber-500/30 text-amber-300 px-3 py-1 rounded text-xs font-bold animate-pulse cursor-not-allowed">⏳ جاري الرفع...</button>`;
                    } else if (item.upload_status === 'completed') {
                        actionButtonHtml = `
                            <div class="flex items-center justify-center gap-2">
                                <span class="text-emerald-400 text-xs font-bold">✅ تم الرفع</span>
                                ${item.cloud_url ? `<a href="${item.cloud_url}" target="_blank" class="bg-cyan-600 hover:bg-cyan-500 text-white px-2.5 py-1 rounded text-[10px] transition">🔗 عرض</a>` : ''}
                            </div>
                        `;
                    } else if (item.upload_status === 'failed') {
                        actionButtonHtml = `<button onclick="quickUpload('${item.file_path}')" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded text-xs transition">❌ إعادة محاولة</button>`;
                    } else {
                        actionButtonHtml = `<button onclick="quickUpload('${item.file_path}')" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1 rounded text-xs transition">رفع ⬆️</button>`;
                    }
                }

                row.innerHTML = `
                    <td class="py-3 px-4 text-center text-slate-400 font-mono">${index + 1}</td>
                    <td class="py-3 px-4 text-center" onclick="event.stopPropagation()">
                        ${item.is_directory ? '' : `<input type="checkbox" class="file-select w-4 h-4 cursor-pointer accent-emerald-500" value="${item.file_path}" onchange="updateBulkUploadButton()">`}
                    </td>
                    <td class="py-3 px-4 font-medium ${item.is_directory ? 'text-amber-400 font-bold' : 'text-slate-200'}">
                        ${item.is_directory ? '📁 ' : '📄 '} ${item.file_name}
                    </td>
                    <td class="py-3 px-4">${item.is_directory ? 'مجلد' : 'ملف'}</td>
                    <td class="py-3 px-4 text-slate-400">${item.is_directory ? item.items_count + ' عناصر' : item.file_size}</td>
                    <td class="py-3 px-4 text-center" onclick="event.stopPropagation()">
                        ${actionButtonHtml}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            document.querySelectorAll('.file-select').forEach(cb => cb.checked = selectAll.checked);
            updateBulkUploadButton();
        }

        function updateBulkUploadButton() {
            const selected = document.querySelectorAll('.file-select:checked').length;
            const btn = document.getElementById('bulkUploadBtn');
            btn.classList.toggle('hidden', selected === 0);
            if (selected > 0) btn.innerText = `⬆️ رفع المحدد (${selected})`;
        }

        async function uploadSelected() {
            const checkboxes = document.querySelectorAll('.file-select:checked');
            if (checkboxes.length === 0 || !activeDeviceId) return;

            const commands = Array.from(checkboxes).map(cb => ({
                device_id: activeDeviceId, action: 'upload', file_name: cb.value, file_path: currentPath
            }));

            const { error } = await supabaseClient.from('device_commands').insert(commands);
            if (!error) {
                alert(`✅ تم طلب رفع ${checkboxes.length} ملفات!`);
                checkboxes.forEach(cb => cb.checked = false);
                document.getElementById('selectAll').checked = false;
                updateBulkUploadButton();
            }
        }

        function goBack() {
            if (!currentPath) return alert("أنت في الجذر!");
            let parts = currentPath.split('/');
            parts.pop(); 
            fetchDirectory(parts.join('/'));
        }

        async function sendDownloadCommand() {
            if (!activeDeviceId) return;
            const fileUrl = document.getElementById('fileUrl').value.trim();
            const fileName = document.getElementById('fileName').value.trim();
            if (!fileUrl || !fileName) return alert("البيانات ناقصة.");
            
            await supabaseClient.from('device_commands').insert([
                { device_id: activeDeviceId, action: 'download', file_url: fileUrl, file_name: fileName, file_path: currentPath }
            ]);
            alert("✅ تم إرسال أمر التحميل.");
        }

        async function sendUploadCommand() {
            if (!activeDeviceId) return;
            const fileName = document.getElementById('uploadFileName').value.trim();
            if (!fileName) return alert("البيانات ناقصة.");
            
            await supabaseClient.from('device_commands').insert([
                { device_id: activeDeviceId, action: 'upload', file_name: fileName, file_path: currentPath }
            ]);
            alert("✅ تم إرسال أمر الرفع.");
        }

        async function quickUpload(filePath) {
            if (!activeDeviceId) return;
            await supabaseClient.from('device_commands').insert([
                { device_id: activeDeviceId, action: 'upload', file_name: filePath, file_path: "" }
            ]);
            alert(`تم طلب الرفع للسحابة.`);
        }

        window.onload = () => {
            loadDevicesAndStatus();
        };
    </script>
</body>
</html>
