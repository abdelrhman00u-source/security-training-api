<!-- Script Logic for Terminal Navigation -->
    <script>
        const SUPABASE_URL = "https://nrkovpnbjzopvifyomea.supabase.co";
        const SUPABASE_KEY = "sb_publishable_UH8BiQIRab4s4HiA7Gh20g_2B1AEMo9";
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentPath = ""; 

        // طلب جلب محتويات مسار معين من الهاتف
        async function fetchDirectory(path) {
            currentPath = path;
            document.getElementById('pathDisplay').innerText = `/Documents/NAS_Storage/${path}`;
            
            // إظهار رسالة تحميل للمستخدم ريثما يرد الهاتف
            const tbody = document.getElementById('fileTableBody');
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-amber-400 font-bold animate-pulse">جاري الاتصال بالهاتف وجلب الملفات... ⏳</td></tr>`;

            // 1. إرسال أمر للهاتف
            await supabaseClient.from('device_commands').insert([
                { action: 'list_directory', file_path: path }
            ]);

            // 2. الانتظار 2.5 ثانية (بدلاً من ثانية واحدة) لضمان إعطاء الهاتف وقتاً لرفع الملفات
            setTimeout(loadFilesFromCache, 2500);
        }

        // تحميل الملفات من جدول الكاش
        async function loadFilesFromCache() {
            const { data, error } = await supabaseClient.from('device_files_cache').select('*');
            const tbody = document.getElementById('fileTableBody');
            
            if (error || !data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500">المجلد فارغ، أو أن الهاتف لم يرد بعد. (اضغط تحديث مرة أخرى)</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(item => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-750 transition cursor-pointer";
                
                if (item.is_directory) {
                    row.onclick = () => fetchDirectory(item.file_path);
                }

                row.innerHTML = `
                    <td class="py-3 px-4 font-medium ${item.is_directory ? 'text-amber-400 font-bold' : 'text-slate-200'}">
                        ${item.is_directory ? '📁 ' : '📄 '} ${item.file_name}
                    </td>
                    <td class="py-3 px-4">${item.is_directory ? 'مجلد' : 'ملف'}</td>
                    <td class="py-3 px-4 text-slate-400">${item.is_directory ? item.items_count + ' عناصر' : item.file_size}</td>
                    <td class="py-3 px-4 text-center" onclick="event.stopPropagation()">
                        ${item.is_directory ? 
                            `<button onclick="fetchDirectory('${item.file_path}')" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded text-xs transition">فتح 📂</button>` :
                            `<button onclick="quickUpload('${item.file_path}')" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1 rounded text-xs transition">رفع للسحابة ⬆️</button>`
                        }
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // زر الرجوع للخلف (CD ..) بإصلاحات المسار
        function goBack() {
            if (!currentPath || currentPath === "") {
                alert("أنت في المجلد الرئيسي بالفعل!");
                return;
            }
            
            // إزالة آخر علامة '/' إذا وجدت لتفادي المسارات الخاطئة
            let path = currentPath.endsWith('/') ? currentPath.slice(0, -1) : currentPath;
            const parts = path.split('/');
            parts.pop(); 
            const parentPath = parts.join('/');
            
            fetchDirectory(parentPath);
        }

        async function sendDownloadCommand() {
            const fileUrl = document.getElementById('fileUrl').value.trim();
            const fileName = document.getElementById('fileName').value.trim();

            if (!fileUrl || !fileName) {
                alert("يرجى إدخال الرابط واسم الملف.");
                return;
            }

            await supabaseClient.from('device_commands').insert([
                { action: 'download', file_url: fileUrl, file_name: fileName, file_path: currentPath }
            ]);
            alert("✅ تم إرسال أمر التحميل للمسار الحالي بنجاح!");
        }

        async function sendUploadCommand() {
            const fileName = document.getElementById('uploadFileName').value.trim();
            if (!fileName) {
                alert("يرجى إدخال اسم الملف.");
                return;
            }

            await supabaseClient.from('device_commands').insert([
                { action: 'upload', file_name: fileName, file_path: currentPath }
            ]);
            alert("✅ تم إرسال أمر الرفع الذكي.");
        }

        async function quickUpload(filePath) {
            await supabaseClient.from('device_commands').insert([
                { action: 'upload', file_name: filePath, file_path: currentPath }
            ]);
            alert(`تم طلب رفع الملف (${filePath}) للسحابة بصمت.`);
        }

        window.onload = () => {
            fetchDirectory("");
        };
    </script>
